<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							"on-tertiary-container": "#63054a",
							"secondary": "#a28efc",
							"surface": "#0e0e0e",
							"primary-fixed-dim": "#8387ff",
							"background": "#0e0e0e",
							"on-surface-variant": "#adaaaa",
							"on-secondary": "#21006d",
							"inverse-on-surface": "#565555",
							"on-error-container": "#ffb2b9",
							"on-primary-fixed-variant": "#0e009d",
							"tertiary-dim": "#ef81c4",
							"inverse-surface": "#fcf9f8",
							"surface-container": "#1a1a1a",
							"tertiary-fixed-dim": "#ef81c4",
							"surface-dim": "#0e0e0e",
							"secondary-fixed-dim": "#c8bbff",
							"outline": "#767575",
							"secondary-dim": "#a28efc",
							"surface-container-lowest": "#000000",
							"primary-dim": "#6063ee",
							"surface-container-highest": "#262626",
							"outline-variant": "#484847",
							"on-primary": "#0f00a4",
							"error-container": "#a70138",
							"inverse-primary": "#494bd7",
							"on-error": "#490013",
							"secondary-container": "#49339d",
							"on-primary-fixed": "#000000",
							"tertiary-fixed": "#ff8ed2",
							"on-secondary-container": "#d4c9ff",
							"on-tertiary-fixed-variant": "#6e1354",
							"secondary-fixed": "#d6cbff",
							"primary": "#a3a6ff",
							"on-background": "#ffffff",
							"surface-bright": "#2c2c2c",
							"surface-variant": "#262626",
							"on-tertiary": "#701455",
							"surface-container-low": "#131313",
							"tertiary-container": "#ff8ed2",
							"on-surface": "#ffffff",
							"on-primary-container": "#0a0081",
							"on-secondary-fixed-variant": "#533ea7",
							"error": "#ff6e84",
							"primary-container": "#9396ff",
							"surface-tint": "#a3a6ff",
							"tertiary": "#ffa5d9",
							"on-secondary-fixed": "#361c89",
							"on-tertiary-fixed": "#3b002b",
							"surface-container-high": "#20201f",
							"primary-fixed": "#9396ff",
							"error-dim": "#d73357"
						},
						borderRadius: {
							DEFAULT: "0.125rem",
							lg: "0.25rem",
							xl: "0.5rem",
							full: "0.75rem"
						},
						fontFamily: {
							headline: ["Space Grotesk", "sans-serif"],
							body: ["Inter", "sans-serif"],
							label: ["Inter", "sans-serif"],
							mono: ["JetBrains Mono", "monospace"]
						}
					}
				}
			}
		</script>
		<style>
			.material-symbols-outlined {
				font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
			}
			body { font-family: 'Inter', sans-serif; }
			.headline-font { font-family: 'Space Grotesk', sans-serif; }
			.mono-font { font-family: 'JetBrains Mono', monospace; }
			::-webkit-scrollbar { width: 4px; }
			::-webkit-scrollbar-track { background: #0e0e0e; }
			::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
			::-webkit-scrollbar-thumb:hover { background: #a3a6ff; }
		</style>
	</head>
	<body class="bg-surface text-on-surface overflow-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
