  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#fbg)" stroke="#8B0000" stroke-width="2"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.4"/>
  
  <g filter="url(#fglow)" transform="translate(100,78)">
