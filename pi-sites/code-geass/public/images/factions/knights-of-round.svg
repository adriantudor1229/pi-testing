    <circle cx="0" cy="0" r="22" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-28" x2="0" y2="-35" stroke="#CC0000" stroke-width="2"/>
    <line x1="0" y1="28" x2="0" y2="35" stroke="#CC0000" stroke-width="2"/>
    <line x1="-28" y1="0" x2="-35" y2="0" stroke="#CC0000" stroke-width="2"/>
    <line x1="28" y1="0" x2="35" y2="0" stroke="#CC0000" stroke-width="2"/>
